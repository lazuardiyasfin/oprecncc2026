name: temp-file-sharing
services:
  app:
    build: .
    container_name: temp-file-sharing
    ports:
      - "${HOST_PORT}:8080"
    volumes:
      - app-data:/app/data
    environment:
      - APP_URL=${APP_URL}
      - APP_PORT=8080
      - UPLOAD_DIR=/app/data/uploads
      - DB_PATH=/app/data/app.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  app-data: